<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NeuroMonarch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="bg-glow bg-glow-a"></div>
  <div class="bg-glow bg-glow-b"></div>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="brand-kicker">AI Fashion Lab</p>
        <h1>NeuroMonarch Designer Chat</h1>
      </div>
      <p class="topbar-note">Generate design art and production-ready apparel mockups in one flow</p>
    </header>

    <div class="workspace-grid">
      <section class="chat-shell">
        <section id="chatWindow" class="chat-window">
          <article class="bubble bubble-bot">
            <p>Welcome to Sable Monarch Bot. I will guide you step-by-step and generate a production-ready mockup.</p>
          </article>
        </section>

        <form id="chatForm" class="composer" enctype="multipart/form-data">
          <input type="hidden" name="audience" value="Male" />
          <input type="hidden" name="garment_type" value="T-Shirt" />
          <input type="hidden" name="print_side" value="Front" />
          <input type="hidden" name="color" value="White" />
          <input type="hidden" name="size" value="M" />
          <input type="hidden" name="print_style" value="Artwork" />
          <input type="hidden" name="material" value="Cotton" />
          <input type="hidden" name="tshirt_type" value="Crew Neck" />
          <input type="hidden" name="message" value="" />

          <div id="optionTray" class="option-tray"></div>

          <div class="message-row">
            <textarea id="chatInput" rows="2" placeholder="Type your design idea..." disabled></textarea>
            <button type="submit" id="sendBtn" disabled>Send</button>
          </div>

          <label class="file-row">
            Reference Image (Optional)
            <input type="file" name="reference_image" accept="image/png,image/jpeg,image/webp" />
          </label>
        </form>
      </section>

      <aside class="history-shell">
        <div class="history-head">
          <h2>Work History</h2>
          <button type="button" id="refreshHistoryBtn">Refresh</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </aside>
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
