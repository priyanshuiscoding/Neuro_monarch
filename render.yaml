services:
  - type: web
    name: neuromonarch
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: PROTOTYPE_DEMO_MODE
        value: "false"
      - key: NVIDIA_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
